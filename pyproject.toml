[project]
name = "starter-home"
version = "0.2.0"
description = "Your first home server."
readme = "README.md"
authors = [
    { name = "Isaac Sikkema", email = "isaacsikkema@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "fabric>=3.2.3",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
starter-home = "starter_home.cli:cli"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
