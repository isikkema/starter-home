- name: List remote restic backups
  hosts: all
  become: false
  gather_facts: no

  vars:
      service_home: /home/starter-home

  tasks:
      - name: List remote snapshots
        ansible.builtin.shell:
            cmd: |
                set -a
                . {{ service_home }}/backup/remote_backup.env
                set +a
                restic snapshots --json
        register: snapshots
        failed_when: false

      - name: Store remote backups
        ansible.builtin.set_fact:
            backups: "{{ (snapshots.stdout | from_json) if snapshots.rc == 0 else [] }}"

      - name: Print remote backups
        ansible.builtin.debug:
            msg: "{{ backups }}"
