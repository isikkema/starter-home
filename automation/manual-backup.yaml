- name: Back up starter-home
  hosts: all
  become: false
  gather_facts: no

  vars:
      service_user: starter-home
      service_uid: 1000
      service_home: /home/starter-home

  pre_tasks:
      - name: Wait for the VM to accept connections
        ansible.builtin.wait_for_connection:
            timeout: 180

      - name: Check for local backup repository
        ansible.builtin.shell:
            cmd: |
                set -a
                . {{ service_home }}/backup/local_backup.env
                set +a
                restic cat config
        register: local_backup_check
        failed_when: local_backup_check.rc != 0 and local_backup_check.rc != 10

      - name: Start local backup service
        become_user: "{{ service_user }}"
        environment:
            XDG_RUNTIME_DIR: "/run/user/{{ service_uid }}"
        ansible.builtin.systemd_service:
            name: local-backup.service
            state: started
            scope: user

      - name: Check for remote backup repository
        ansible.builtin.shell:
            cmd: |
                set -a
                . {{ service_home }}/backup/remote_backup.env
                set +a
                restic cat config
        register: remote_backup_check
        failed_when: remote_backup_check.rc != 0 and remote_backup_check.rc != 10

      - name: Start remote backup service
        become_user: "{{ service_user }}"
        environment:
            XDG_RUNTIME_DIR: "/run/user/{{ service_uid }}"
        ansible.builtin.systemd_service:
            name: remote-backup.service
            state: started
            scope: user
