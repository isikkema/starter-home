- name: List restic backups
  hosts: all
  become: false
  gather_facts: no

  vars:
      service_home: /home/starter-home

  tasks:
      - name: List local snapshots
        ansible.builtin.shell:
            cmd: |
                set -a
                . {{ service_home }}/backup/local_backup.env
                set +a
                restic snapshots --json
        register: local_snapshots
        failed_when: false

      - name: Store local backups
        ansible.builtin.set_fact:
            local_backups: "{{ (local_snapshots.stdout | from_json) if local_snapshots.rc == 0 else [] }}"

      - name: Print local backups
        ansible.builtin.debug:
            msg: "{{ local_backups }}"

      - name: List remote snapshots
        ansible.builtin.shell:
            cmd: |
                set -a
                . {{ service_home }}/backup/remote_backup.env
                set +a
                restic snapshots --json
        register: remote_snapshots

      - name: Store remote backups
        ansible.builtin.set_fact:
            remote_backups: "{{ remote_snapshots.stdout | from_json }}"

      - name: Print remote backups
        ansible.builtin.debug:
            msg: "{{ remote_backups }}"
